<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis TKA Bahasa Indonesia - SD/MI Paket 1</title>
    <meta name="description" content="Prediksi Soal TKA Bahasa Indonesia SD/MI Paket 1 bergaya Quizizz - 30 Soal Pilihan Ganda">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sound Toggle -->
    <button class="sound-toggle" id="sound-toggle" title="Toggle suara">
        <i class="fa-solid fa-volume-high"></i>
    </button>

    <div class="app-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="logo-container">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
            </div>
            <h1>TKA Bahasa Indonesia SD</h1>
            <p>Prediksi Soal Paket 1</p>
            <div class="stats-preview">
                <div class="stat-pill"><i class="fa-solid fa-list-ol"></i> 30 Soal</div>
                <div class="stat-pill"><i class="fa-solid fa-star"></i> 3000 Poin Maks</div>
            </div>
            <div class="name-input-container">
                <!-- Monster Avatar -->
                <img id="monster-avatar-start" src="https://robohash.org/peserta?set=set2&size=120x120" alt="Monster Lucu" class="monster-avatar bouncing" />
                
                <label for="player-name"><i class="fa-solid fa-user"></i> Nama Peserta</label>
                <input type="text" class="name-input" id="player-name" placeholder="Ketik namamu di sini..." maxlength="40" autocomplete="off">
            </div>
            <button id="start-btn" class="btn btn-primary action-btn">
                Mulai Kuis <i class="fa-solid fa-play"></i>
            </button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="game-stats">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img id="monster-avatar-game" src="https://robohash.org/peserta?set=set2&size=40x40" alt="Avatar" class="mini-avatar" />
                        <div class="question-counter" id="question-counter">1 / 30</div>
                    </div>
                    <div id="streak-container" style="display:none;" class="streak-display">
                        <i class="fa-solid fa-fire"></i> <span id="streak-count">0</span>
                    </div>
                    <div class="score-display">
                        <i class="fa-solid fa-star"></i> <span id="score">0</span>
                    </div>
                </div>
            </div>
            <div class="question-container">
                <h2 id="question-text">Memuat pertanyaan...</h2>
            </div>
            <div class="options-container" id="options-container">
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <div class="result-header">
                <i class="fa-solid fa-trophy trophy-icon" id="trophy-icon"></i>
                <h2 id="result-title">Kuis Selesai!</h2>
                <p id="result-player-name" style="margin-top:5px; font-weight:700;"></p>
            </div>
            <div class="score-card">
                <div class="score-circle" id="score-circle">
                    <span id="final-score" class="final-score-text">0</span>
                    <span class="score-label">Skor Akhir</span>
                </div>
                <div class="result-details">
                    <div class="detail-item correct">
                        <i class="fa-solid fa-check"></i> Benar: <span id="correct-count">0</span>
                    </div>
                    <div class="detail-item incorrect">
                        <i class="fa-solid fa-xmark"></i> Salah: <span id="incorrect-count">0</span>
                    </div>
                </div>
            </div>

            <!-- Category Summary -->
            <div class="category-summary" id="category-summary">
                <h3><i class="fa-solid fa-chart-pie"></i> Analisis per Kategori</h3>
                <div class="category-list" id="category-list"></div>
            </div>

            <div class="action-buttons">
                <button id="review-btn" class="btn btn-secondary action-btn">
                    <i class="fa-solid fa-eye"></i> Tinjau Jawaban
                </button>
                <button id="download-btn" class="btn btn-success action-btn">
                    <i class="fa-solid fa-download"></i> Unduh Hasil (TXT)
                </button>
                <button id="restart-btn" class="btn btn-primary action-btn">
                    Main Lagi <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- Review Screen -->
        <div id="review-screen" class="screen">
            <div class="review-header">
                <h2><i class="fa-solid fa-eye"></i> Tinjauan Jawaban</h2>
                <button id="back-to-result-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="review-filters" id="review-filters">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="wrong">Salah Saja</button>
                <button class="filter-btn" data-filter="correct">Benar Saja</button>
            </div>
            <div class="review-list" id="review-list">
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
